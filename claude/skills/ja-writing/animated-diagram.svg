<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 170" width="904" height="170" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .title { font-size: 15px; font-weight: 600; fill: #0f172a; }
    .box rect { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
    .num { font-size: 12px; font-weight: 600; fill: #2563eb; }
    .head { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .sub { font-size: 12px; fill: #475569; }
    .arrow { stroke: #64748b; stroke-width: 1.5; }
    .dot { fill: #2563eb; opacity: 0; }

    .box rect { animation: hl 8s infinite; }
    .s2 rect { animation-delay: 2s; }
    .s3 rect { animation-delay: 4s; }
    .s4 rect { animation-delay: 6s; }
    @keyframes hl {
      0%, 22% { fill: #dbeafe; stroke: #2563eb; }
      25%, 100% { fill: #ffffff; stroke: #94a3b8; }
    }

    .dot { animation: move 8s infinite; }
    .d1 { animation-delay: 0.9s; }
    .d2 { animation-delay: 2.9s; }
    .d3 { animation-delay: 4.9s; }
    @keyframes move {
      0% { opacity: 0; transform: translateX(0); }
      2% { opacity: 1; }
      15% { opacity: 1; transform: translateX(44px); }
      17%, 100% { opacity: 0; transform: translateX(44px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .box rect, .dot { animation: none; }
    }
  </style>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect class="bg" width="904" height="170"/>
  <text class="title" x="16" y="30">ja-writing の仕上げの流れ</text>

  <g class="box s1">
    <rect x="16" y="56" width="176" height="88" rx="8"/>
    <text class="num" x="32" y="80">1</text>
    <text class="head" x="32" y="104">本文を書く</text>
    <text class="sub" x="32" y="126">構成と内容は自分で決める</text>
  </g>
  <g class="box s2">
    <rect x="248" y="56" width="176" height="88" rx="8"/>
    <text class="num" x="264" y="80">2</text>
    <text class="head" x="264" y="104">polish.py に通す</text>
    <text class="sub" x="264" y="126">Gemini が語彙を整える</text>
  </g>
  <g class="box s3">
    <rect x="480" y="56" width="176" height="88" rx="8"/>
    <text class="num" x="496" y="80">3</text>
    <text class="head" x="496" y="104">差分を確かめる</text>
    <text class="sub" x="496" y="126">数値や構造の変化を戻す</text>
  </g>
  <g class="box s4">
    <rect x="712" y="56" width="176" height="88" rx="8"/>
    <text class="num" x="728" y="80">4</text>
    <text class="head" x="728" y="104">採る部分だけ反映</text>
    <text class="sub" x="728" y="126">機械的に上書きしない</text>
  </g>

  <line class="arrow" x1="192" y1="100" x2="246" y2="100" marker-end="url(#tip)"/>
  <line class="arrow" x1="424" y1="100" x2="478" y2="100" marker-end="url(#tip)"/>
  <line class="arrow" x1="656" y1="100" x2="710" y2="100" marker-end="url(#tip)"/>

  <circle class="dot d1" cx="196" cy="100" r="5"/>
  <circle class="dot d2" cx="428" cy="100" r="5"/>
  <circle class="dot d3" cx="660" cy="100" r="5"/>
</svg>
