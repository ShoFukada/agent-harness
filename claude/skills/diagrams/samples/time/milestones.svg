<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 200" width="560" height="200" role="img" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<title>マイルストーン</title>
<desc>形: 時の流れの線に節目をひし形で置き、各節目の下に「何ができたら通過か」の条件を書く。
使う場面: 節目ごとの完了条件を顧客と合わせる。計画の説明、受入の前提。
使わない場面: 日々の作業の重なりが要点のとき（ガント風の予定）、済んだ出来事を並べるとき（時間軸）。</desc>
<style>
/* base: base.css から build_catalog.py が書き写す。ここは直接直さない */
.dg{--_bg:var(--dg-bg,#ffffff);--_ink:var(--dg-ink,#18202c);--_sub:var(--dg-sub,#596579);--_line:var(--dg-line,#c3cbd6);--_link:var(--dg-link,#9aa6b6);--_soft:var(--dg-soft,#f3f5f8);--_a:var(--dg-a,#365fb5);--_a-bg:var(--dg-a-bg,#edf2fb);--_b:var(--dg-b,#8a621e);--_b-bg:var(--dg-b-bg,#f8f2e7);--_c:var(--dg-c,#26786d);--_c-bg:var(--dg-c-bg,#edf5f2);--_w:var(--dg-w,#a34f39);--_w-bg:var(--dg-w-bg,#faefea)}
@media (prefers-color-scheme:dark){.dg{--_bg:var(--dg-bg,#181e27);--_ink:var(--dg-ink,#e6eaf1);--_sub:var(--dg-sub,#abb5c5);--_line:var(--dg-line,#596679);--_link:var(--dg-link,#7d899b);--_soft:var(--dg-soft,#222b37);--_a:var(--dg-a,#8aa7e8);--_a-bg:var(--dg-a-bg,#222e45);--_b:var(--dg-b,#d4b16c);--_b-bg:var(--dg-b-bg,#342e23);--_c:var(--dg-c,#77bfb0);--_c-bg:var(--dg-c-bg,#213630);--_w:var(--dg-w,#df9b83);--_w-bg:var(--dg-w-bg,#3a2b26)}}
.dg text{fill:var(--_ink);font-size:13px;font-weight:400}
.dg .bg{fill:var(--_bg)}
.dg .g{font-size:16px;font-weight:600}
.dg .h{font-size:14px;font-weight:600}
.dg .s{font-size:12px;font-weight:400;fill:var(--_sub)}
.dg .n{font-size:12px;font-weight:600;fill:var(--_a)}
.dg .mid{text-anchor:middle}
.dg .end{text-anchor:end}
.dg .box{fill:var(--_bg);stroke:var(--_line);stroke-width:1}
.dg .soft{fill:var(--_soft);stroke:none}
.dg .fa{fill:var(--_a-bg);stroke:var(--_a);stroke-width:1.25}
.dg .fb{fill:var(--_b-bg);stroke:var(--_b);stroke-width:1.25}
.dg .fc{fill:var(--_c-bg);stroke:var(--_c);stroke-width:1.25}
.dg .fw{fill:var(--_w-bg);stroke:var(--_w);stroke-width:1.25}
.dg .pa{fill:var(--_a-bg);stroke:none}
.dg .pb{fill:var(--_b-bg);stroke:none}
.dg .pc{fill:var(--_c-bg);stroke:none}
.dg .pw{fill:var(--_w-bg);stroke:none}
.dg .ta{fill:var(--_a)}
.dg .tb{fill:var(--_b)}
.dg .tc{fill:var(--_c)}
.dg .tw{fill:var(--_w)}
.dg .ln{stroke:var(--_line);stroke-width:1;fill:none}
.dg .cn{stroke:var(--_link);stroke-width:1.5;fill:none}
.dg .ar{stroke:var(--_sub);stroke-width:1.5;fill:none}
.dg .em{stroke:var(--_a);stroke-width:2;fill:none}
.dg .ew{stroke:var(--_w);stroke-width:1.5;fill:none}
.dg .dash{stroke-dasharray:4 4}
.dg .tip{fill:var(--_sub);fill:context-stroke}
.dg .dot{fill:var(--_a)}
.dg .ring{fill:var(--_bg);stroke:var(--_sub);stroke-width:1.5}
/* /base */
.dg text.h{font-size:13px}
</style>
<defs><marker id="dg-tip" viewBox="0 0 8 6" refX="8" refY="3" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path class="tip" d="M0,0 L8,3 L0,6 z"/></marker></defs>
<rect class="bg" width="560" height="200"/>
<line class="ar" x1="24" y1="64" x2="536" y2="64" marker-end="url(#dg-tip)"/>
<polygon class="fc" points="86,54 96,64 86,74 76,64"/>
<text class="s mid" x="86" y="22">12/5<tspan class="tc" dx="6">済</tspan></text><text class="h mid" x="86" y="42">要件を確定</text>
<line class="ln" x1="86" y1="74" x2="86" y2="92"/>
<rect class="soft" x="26" y="92" width="120" height="76" rx="6"/><text class="s" x="38" y="112">条件</text>
<text style="font-size:12px" x="38" y="134">要件書の承認</text>
<text style="font-size:12px" x="38" y="154">画面の数が決まる</text>
<polygon class="fc" points="214,54 224,64 214,74 204,64"/>
<text class="s mid" x="214" y="22">12/19<tspan class="tc" dx="6">済</tspan></text><text class="h mid" x="214" y="42">画面を見せる</text>
<line class="ln" x1="214" y1="74" x2="214" y2="92"/>
<rect class="soft" x="154" y="92" width="120" height="76" rx="6"/><text class="s" x="166" y="112">条件</text>
<text style="font-size:12px" x="166" y="134">主な画面が動く</text>
<text style="font-size:12px" x="166" y="154">顧客が触れる</text>
<polygon class="box" points="342,54 352,64 342,74 332,64"/>
<text class="s mid" x="342" y="22">1/16</text><text class="h mid" x="342" y="42">受入テスト</text>
<line class="ln" x1="342" y1="74" x2="342" y2="92"/>
<rect class="soft" x="282" y="92" width="120" height="76" rx="6"/><text class="s" x="294" y="112">条件</text>
<text style="font-size:12px" x="294" y="134">QA 項目を通す</text>
<text style="font-size:12px" x="294" y="154">直しが残らない</text>
<polygon class="box" points="470,54 480,64 470,74 460,64"/>
<text class="s mid" x="470" y="22">1/30</text><text class="h mid" x="470" y="42">本番開始</text>
<line class="ln" x1="470" y1="74" x2="470" y2="92"/>
<rect class="soft" x="410" y="92" width="120" height="76" rx="6"/><text class="s" x="422" y="112">条件</text>
<text style="font-size:12px" x="422" y="134">移行が終わる</text>
<text style="font-size:12px" x="422" y="154">窓口が決まる</text>
<text class="s" x="16" y="190">緑の印と「済」は通過した節目</text>
</svg>
