<line class="ln" x1="430" y1="16" x2="430" y2="198"/><text class="s" x="436" y="32">12/29</text>
<line class="ln" x1="486" y1="16" x2="486" y2="198"/><text class="s" x="492" y="32">1/5</text>
<line class="ln" x1="542" y1="16" x2="542" y2="198"/>
<line class="ln" x1="16" y1="40" x2="542" y2="40"/>
<text x="24" y="69">要件の確認</text><rect class="fa" x="150" y="54" width="88" height="20" rx="4"/>
<text x="24" y="99">設計</text><rect class="fa" x="206" y="84" width="88" height="20" rx="4"/>
<text x="24" y="129">作る</text><rect class="fa" x="262" y="114" width="144" height="20" rx="4"/>
<text x="24" y="159">受入テスト</text><rect class="fb" x="390" y="144" width="72" height="20" rx="4"/>
<text x="24" y="189">本番開始</text>
<polygon class="fa" points="486,174 495,184 486,194 477,184"/>
<line class="ew dash" x1="286" y1="40" x2="286" y2="198"/>
<text class="s tw" x="290" y="212">今日</text>
<text class="s" x="16" y="228">青は自社、黄土は顧客の作業。1 列が 1 週</text>
</svg>
