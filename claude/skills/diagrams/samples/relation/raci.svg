<text x="28" y="107">画面を作る</text>
<rect class="fb" x="196" y="91" width="52" height="22" rx="11"/><text class="mid tb" x="222" y="107">承認</text>
<rect class="fa" x="288" y="91" width="52" height="22" rx="11"/><text class="mid ta" x="314" y="107">担当</text>
<text class="s mid" x="406" y="107">相談</text>
<line class="ln" x1="16" y1="120" x2="544" y2="120"/>
<text x="28" y="143">受入テスト</text>
<rect class="fa" x="196" y="127" width="52" height="22" rx="11"/><text class="mid ta" x="222" y="143">担当</text>
<text class="s mid" x="314" y="143">相談</text>
<rect class="fb" x="380" y="127" width="52" height="22" rx="11"/><text class="mid tb" x="406" y="143">承認</text>
<line class="ln" x1="16" y1="156" x2="544" y2="156"/>
<text x="28" y="179">本番に出す</text>
<rect class="fb" x="196" y="163" width="52" height="22" rx="11"/><text class="mid tb" x="222" y="179">承認</text>
<rect class="fa" x="288" y="163" width="52" height="22" rx="11"/><text class="mid ta" x="314" y="179">担当</text>
<text class="s mid" x="406" y="179">報告</text>
<text class="s mid" x="498" y="179">相談</text>
<line class="ln" x1="16" y1="192" x2="544" y2="192"/>
<text class="s" x="16" y="216">担当＝手を動かす　承認＝最後に決める（各行 1 人）</text>
<text class="s" x="16" y="234">相談＝事前に聞く　報告＝後で知らせる</text>
</svg>
