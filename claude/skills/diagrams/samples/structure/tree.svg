<g><rect class="box" x="384" y="86" width="160" height="36" rx="6"/><text class="mid" x="464" y="109">要望 18 件</text></g>
<g><rect class="box" x="16" y="158" width="76" height="32" rx="4"/><text class="s mid" x="54" y="178">画面</text></g>
<g><rect class="box" x="100" y="158" width="76" height="32" rx="4"/><text class="s mid" x="138" y="178">帳票</text></g>
<g><rect class="fw" x="200" y="158" width="76" height="32" rx="4"/><text class="mid" x="238" y="178">再現した</text></g>
<g><rect class="box" x="284" y="158" width="76" height="32" rx="4"/><text class="s mid" x="322" y="178">未再現</text></g>
<g><rect class="box" x="384" y="158" width="160" height="32" rx="4"/><text class="s mid" x="464" y="178">次の改修で検討</text></g>
</svg>
