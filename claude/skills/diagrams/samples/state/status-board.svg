<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 560 224" width="560" height="224" role="img" font-family="'Hiragino Sans','Noto Sans JP',sans-serif">
<title>状態ごとの件数</title>
<desc>形: 状態ごとに縦の列を立て、件数を見出しに、項目をカードで積む。滞っている列だけ色を変える。
使う場面: どの状態で仕事が溜まっているかを見せる。課題の棚卸し、問い合わせの滞留、確認待ちの多さ。
使わない場面: 状態の移り方そのものが要点のとき（状態遷移図）、件数の推移を見せたいとき（グラフにし dataviz skill に従う）。</desc>
<style>
/* base: base.css から build_catalog.py が書き写す。ここは直接直さない */
.dg{--_bg:var(--dg-bg,#ffffff);--_ink:var(--dg-ink,#18202c);--_sub:var(--dg-sub,#596579);--_line:var(--dg-line,#c3cbd6);--_link:var(--dg-link,#9aa6b6);--_soft:var(--dg-soft,#f3f5f8);--_a:var(--dg-a,#365fb5);--_a-bg:var(--dg-a-bg,#edf2fb);--_b:var(--dg-b,#8a621e);--_b-bg:var(--dg-b-bg,#f8f2e7);--_c:var(--dg-c,#26786d);--_c-bg:var(--dg-c-bg,#edf5f2);--_w:var(--dg-w,#a34f39);--_w-bg:var(--dg-w-bg,#faefea)}
@media (prefers-color-scheme:dark){.dg{--_bg:var(--dg-bg,#181e27);--_ink:var(--dg-ink,#e6eaf1);--_sub:var(--dg-sub,#abb5c5);--_line:var(--dg-line,#596679);--_link:var(--dg-link,#7d899b);--_soft:var(--dg-soft,#222b37);--_a:var(--dg-a,#8aa7e8);--_a-bg:var(--dg-a-bg,#222e45);--_b:var(--dg-b,#d4b16c);--_b-bg:var(--dg-b-bg,#342e23);--_c:var(--dg-c,#77bfb0);--_c-bg:var(--dg-c-bg,#213630);--_w:var(--dg-w,#df9b83);--_w-bg:var(--dg-w-bg,#3a2b26)}}
.dg text{fill:var(--_ink);font-size:13px;font-weight:400}
.dg .bg{fill:var(--_bg)}
.dg .g{font-size:16px;font-weight:600}
.dg .h{font-size:14px;font-weight:600}
.dg .s{font-size:12px;font-weight:400;fill:var(--_sub)}
.dg .n{font-size:12px;font-weight:600;fill:var(--_a)}
.dg .mid{text-anchor:middle}
.dg .end{text-anchor:end}
.dg .box{fill:var(--_bg);stroke:var(--_line);stroke-width:1}
.dg .soft{fill:var(--_soft);stroke:none}
.dg .fa{fill:var(--_a-bg);stroke:var(--_a);stroke-width:1.25}
.dg .fb{fill:var(--_b-bg);stroke:var(--_b);stroke-width:1.25}
.dg .fc{fill:var(--_c-bg);stroke:var(--_c);stroke-width:1.25}
.dg .fw{fill:var(--_w-bg);stroke:var(--_w);stroke-width:1.25}
.dg .pa{fill:var(--_a-bg);stroke:none}
.dg .pb{fill:var(--_b-bg);stroke:none}
.dg .pc{fill:var(--_c-bg);stroke:none}
.dg .pw{fill:var(--_w-bg);stroke:none}
.dg .ta{fill:var(--_a)}
.dg .tb{fill:var(--_b)}
.dg .tc{fill:var(--_c)}
.dg .tw{fill:var(--_w)}
.dg .ln{stroke:var(--_line);stroke-width:1;fill:none}
.dg .cn{stroke:var(--_link);stroke-width:1.5;fill:none}
.dg .ar{stroke:var(--_sub);stroke-width:1.5;fill:none}
.dg .em{stroke:var(--_a);stroke-width:2;fill:none}
.dg .ew{stroke:var(--_w);stroke-width:1.5;fill:none}
.dg .dash{stroke-dasharray:4 4}
.dg .tip{fill:var(--_sub);fill:context-stroke}
.dg .dot{fill:var(--_a)}
.dg .ring{fill:var(--_bg);stroke:var(--_sub);stroke-width:1.5}
/* /base */
</style>
<rect class="bg" width="560" height="224"/>
<rect class="soft" x="16" y="14" width="124" height="196" rx="8"/>
<text class="h" x="26" y="38">未着手</text>
<text class="s end" x="130" y="38">3 件</text>
<rect class="box" x="24" y="52" width="108" height="30" rx="4"/><text x="32" y="72">請求書の様式</text>
<rect class="box" x="24" y="90" width="108" height="30" rx="4"/><text x="32" y="110">権限の整理</text>
<rect class="box" x="24" y="128" width="108" height="30" rx="4"/><text x="32" y="148">ログの保存期間</text>
<rect class="soft" x="150" y="14" width="124" height="196" rx="8"/>
<text class="h" x="160" y="38">作業中</text>
<text class="s end" x="264" y="38">2 件</text>
<rect class="box" x="158" y="52" width="108" height="30" rx="4"/><text x="166" y="72">一覧の検索</text>
<rect class="box" x="158" y="90" width="108" height="30" rx="4"/><text x="166" y="110">CSV の取り込み</text>
<rect class="pw" x="284" y="14" width="124" height="196" rx="8"/>
<text class="h tw" x="294" y="38">確認待ち</text>
<text class="h end tw" x="398" y="38">4 件</text>
<rect class="box" x="292" y="52" width="108" height="30" rx="4"/><text x="300" y="72">帳票の文言</text>
<rect class="box" x="292" y="90" width="108" height="30" rx="4"/><text x="300" y="110">通知の宛先</text>
<rect class="box" x="292" y="128" width="108" height="30" rx="4"/><text x="300" y="148">画面の色</text>
<rect class="box" x="292" y="166" width="108" height="30" rx="4"/><text x="300" y="186">移行の手順</text>
<rect class="soft" x="418" y="14" width="124" height="196" rx="8"/>
<text class="h" x="428" y="38">完了</text>
<text class="s end" x="532" y="38">6 件</text>
<rect class="box" x="426" y="52" width="108" height="30" rx="4"/><text x="434" y="72">ログイン</text>
<text class="s" x="434" y="110">…ほか 5 件</text>
</svg>
