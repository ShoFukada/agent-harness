<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" role="img" aria-label="一覧画面の案。青い点線の列が判断待ちの担当者の列">
 <g font-size="11" fill="currentColor">
  <rect x="0" y="0" width="460" height="120" rx="6" fill="none" stroke="currentColor" opacity=".4"/>
  <rect x="10" y="10" width="160" height="18" rx="3" fill="none" stroke="currentColor" opacity=".4"/><text x="16" y="23" opacity=".6">問い合わせを検索</text>
  <text x="12" y="48" font-weight="600">受付日</text><text x="86" y="48" font-weight="600">件名</text><text x="160" y="48" font-weight="600">顧客</text><text x="234" y="48" font-weight="600">状態</text><text x="308" y="48" font-weight="600">期限</text>
  <rect x="382" y="36" width="70" height="18" rx="3" fill="none" stroke="#2563eb" stroke-dasharray="3 2"/><text x="388" y="48" fill="#2563eb">担当者？</text>
  <line x1="10" x2="450" y1="58" y2="58" stroke="currentColor" opacity=".15"/><line x1="10" x2="450" y1="78" y2="78" stroke="currentColor" opacity=".15"/><line x1="10" x2="450" y1="98" y2="98" stroke="currentColor" opacity=".15"/>
  <rect x="12" y="64" width="420" height="8" rx="2" fill="currentColor" opacity=".08"/><rect x="12" y="84" width="420" height="8" rx="2" fill="currentColor" opacity=".08"/>
  <text x="0" y="136" opacity=".7">青い点線の列が、判断待ちの「担当者」の列</text>
 </g></svg>
