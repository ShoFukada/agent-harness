<rect class="box" x="124" y="144" width="136" height="36" rx="4"/>
<text x="132" y="167">期限切れ</text>
<line class="em" x1="124" y1="190" x2="260" y2="190"/>
<text class="n" x="132" y="206">今の線</text>
<rect class="box" x="124" y="216" width="136" height="36" rx="4"/>
<text x="132" y="239">今日・明日・今週</text>
<line class="ln" x1="272" y1="64" x2="272" y2="272"/>
<text class="h" x="282" y="88">案件の今</text>
<text class="s" x="282" y="112">節目</text>
<text class="s" x="282" y="134">仕事ごとの</text>
<text class="s" x="282" y="152">状態</text>
<text class="s" x="282" y="180">話し中</text>
<text class="s" x="282" y="202">顧客待ち</text>
<text class="s" x="282" y="224">片付いた</text>
<rect class="box" x="392" y="40" width="352" height="232" rx="8"/>
<path class="soft" d="M400,40.5 H736 a7.5,7.5 0 0 1 7.5,7.5 V64 H392.5 V48 a7.5,7.5 0 0 1 7.5,-7.5 z"/>
<line class="ln" x1="392" y1="64" x2="744" y2="64"/>
<text class="g" x="392" y="26">主のディスプレイ</text>
<text class="s" x="406" y="57">Orca</text>
<path class="soft" d="M392.5,64 H492 V271.5 H400 a7.5,7.5 0 0 1 -7.5,-7.5 z"/>
<text class="s" x="404" y="88">サイドバー</text>
<text x="404" y="112">窓口</text>
<text x="416" y="134">担当</text>
<text class="s" x="428" y="156">worker</text>
<text x="416" y="178">担当</text>
<text class="s" x="428" y="200">worker</text>
<line class="ln" x1="492" y1="64" x2="492" y2="272"/>
<text class="h" x="504" y="88">担当のチャット</text>
<rect class="fa" x="504" y="100" width="124" height="56" rx="4"/>
<text x="512" y="122">カードの書き出し</text>
<text class="s" x="512" y="142">を貼って話す</text>
<text class="s" x="504" y="184">決めたことは</text>
<text class="s" x="504" y="202">担当がカードに</text>
<text class="s" x="504" y="220">書き戻す</text>
<line class="ln" x1="640" y1="64" x2="640" y2="272"/>
<text class="h" x="650" y="88">右の欄</text>
<text class="s" x="650" y="112">PR・資料・</text>
<text class="s" x="650" y="130">ページなど、</text>
<text class="s" x="650" y="148">話している</text>
<text class="s" x="650" y="166">成果物</text>
<path class="em" d="M192,252 V292 H614 V158" marker-end="url(#dg-tip)"/>
<rect class="bg" x="316" y="282" width="168" height="20"/>
<text class="n mid" x="400" y="297">「担当と話す」で渡す</text>

</svg>
